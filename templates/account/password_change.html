{% extends "base.html" %}

{% block title %}Change your password — RHP{% endblock %}

{% block content %}
  <div class="mx-auto w-full max-w-md">
    <div class="rhp-card">
      <h1 class="text-xl font-semibold tracking-tight">Change your password</h1>
      <form method="post" class="mt-6" novalidate>
        {% csrf_token %}
        {% include "components/form.html" with form=form %}
        <div class="mt-6 flex items-center gap-3">
          <button type="submit" class="rhp-btn rhp-btn-primary">Save password</button>
          <a href="{% url 'accounts:profile' %}" class="rhp-btn rhp-btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
