{% extends "base.html" %}

{% block title %}Reset your password — RHP{% endblock %}

{% block content %}
  <div class="mx-auto w-full max-w-md">
    <div class="rhp-card">
      <h1 class="text-xl font-semibold tracking-tight">Reset your password</h1>
      <p class="mt-1 text-sm text-ink-muted">
        Enter the email address on your account and we will send a reset link.
      </p>

      <form method="post" class="mt-6" novalidate>
        {% csrf_token %}
        {% include "components/form.html" with form=form %}
        <button type="submit" class="rhp-btn rhp-btn-primary mt-6 w-full">Email me a reset link</button>
      </form>
    </div>

    <p class="mt-4 text-center text-sm">
      <a href="{% url 'accounts:login' %}" class="font-medium text-primary underline-offset-2 hover:underline">
        Back to sign in
      </a>
    </p>
  </div>
{% endblock %}
