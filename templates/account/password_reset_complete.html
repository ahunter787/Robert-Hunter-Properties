{% extends "base.html" %}

{% block title %}Password updated — RHP{% endblock %}

{% block content %}
  <div class="mx-auto w-full max-w-md">
    <div class="rhp-card">
      <h1 class="text-xl font-semibold tracking-tight">Password updated</h1>
      <p class="mt-3 text-sm leading-relaxed text-ink-muted">
        Your password has been changed. Sign in with it now.
      </p>
      <a href="{% url 'accounts:login' %}" class="rhp-btn rhp-btn-primary mt-6">Sign in</a>
    </div>
  </div>
{% endblock %}
