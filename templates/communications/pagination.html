{% if page.has_other_pages %}<nav class="flex flex-wrap gap-4" aria-label="Pages">{% if page.has_previous %}<a class="rhp-link" href="?{{ filter_query }}&amp;page={{ page.previous_page_number }}">Previous page</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="rhp-link" href="?{{ filter_query }}&amp;page={{ page.next_page_number }}">Next page</a>{% endif %}</nav>{% endif %}
