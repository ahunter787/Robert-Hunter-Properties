{% extends "communications/base.html" %}
{% block workspace %}<section class="workspace-section mx-auto max-w-2xl space-y-4"><h2 class="text-xl font-semibold">{{ title }}</h2>{% if guidance %}<p>{{ guidance }}</p>{% endif %}<form method="{{ method|default:'post' }}" class="space-y-4" novalidate>{% if method != 'get' %}{% csrf_token %}{% endif %}{% include "components/form.html" %}<div class="flex flex-wrap gap-3"><button class="rhp-btn rhp-btn-primary">{{ button }}</button><a class="rhp-btn rhp-btn-secondary" href="{% if communication_section == 'announcements' %}{% url namespace|add:':announcements' %}{% else %}{% url namespace|add:':index' %}{% endif %}">Cancel</a></div></form></section>{% endblock %}
