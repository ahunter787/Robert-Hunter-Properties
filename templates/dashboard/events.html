<ol class="divide-y divide-border">{% for event in events %}<li class="py-3"><p class="font-semibold">{{ event.label }}</p><p>{% if event.url %}<a class="rhp-link" href="{{ event.url }}">{{ event.context }}</a>{% else %}{{ event.context }}{% endif %}</p><p class="rhp-help">{{ event.actor }} · {{ event.date|date:"M j, Y, g:i A T" }}</p></li>{% empty %}<li class="py-4">No matching activity has been recorded.</li>{% endfor %}</ol>
