{% if person.tenant_profile.photo %}{% url 'manage:account-photo' person.pk as portrait_url %}{% else %}{% firstof '' as portrait_url %}{% endif %}
<a href="{% url 'manage:account-detail' person.pk %}" class="inline-flex items-center gap-2">
  <span class="person-image"><span aria-hidden="true">{{ person.display_name|first }}</span>{% if portrait_url %}<img src="{{ portrait_url }}" alt="" loading="lazy">{% endif %}</span>
  <span>{{ person.display_name }}</span>
</a>
