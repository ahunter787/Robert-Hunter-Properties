{% if is_paginated %}<nav class="record-actions" aria-label="Results pages"><span>Page {{ page_obj.number }} of {{ paginator.num_pages }}</span>{% if page_obj.has_previous %}<a href="?q={{ search|urlencode }}&amp;status={{ status|urlencode }}&amp;page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}{% if page_obj.has_next %}<a href="?q={{ search|urlencode }}&amp;status={{ status|urlencode }}&amp;page={{ page_obj.next_page_number }}">Next</a>{% endif %}</nav>{% endif %}
