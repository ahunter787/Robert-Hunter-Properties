[project]
name = "rhp"
version = "0.1.0"
description = "Robert Hunter Properties — self-hosted property management and tenant portal"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django==6.1.1",
    "psycopg[binary]==3.3.6",
    "gunicorn==26.2.0",
    "django-environ==0.14.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.0.0",
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "migrations", "staticfiles", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ", "S", "T20"]
ignore = [
    "S101", # assert — used freely in tests
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F405", "F403"]
# Tests intentionally use fake secrets and spawn local interpreters/git.
"tests/*.py" = ["S105", "S106", "S107", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/settings/*"]
