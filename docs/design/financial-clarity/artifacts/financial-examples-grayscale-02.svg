<text x="558" y="135" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#232323">Studio A</text>
<text x="46" y="163" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#171717">Choose one setup method</text>
<text x="46" y="195" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#171717">1. Choose: Full history / Starting balance</text>
<text x="46" y="214" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#171717">Do not display both methods&#x27; inputs together.</text>
<text x="46" y="253" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#171717">2. Starting balance: </text>
<text x="150.53300000000002" y="253" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3c3c3c">$200.00</text>
<text x="190.287" y="253" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#171717"> owed</text>
<text x="46" y="272" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#171717">Balance as of Oct 1; charges begin Oct 1. Source: old records.</text>
<text x="46" y="311" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#171717">3. Review the resulting account</text>
<text x="46" y="330" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#171717">One starting charge; no newly received payment.</text>
<text x="46" y="369" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#171717">Confirm starting records</text>
<text x="46" y="388" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#171717">No calculation of implied prior receipts in this proposal.</text>
<text x="558" y="169" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#171717">Starting records</text>
<text x="558" y="195" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#171717">Step 1 of 3</text>
<text x="558" y="221" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#171717">Choose a method</text>
<text x="558" y="247" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#171717">Full history</text>
<text x="558" y="273" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#171717">Starting balance</text>
<text x="558" y="299" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#171717">Continue</text>
<text x="558" y="325" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#171717">Back / Cancel</text>
<text x="558" y="351" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#171717">Only relevant fields</text>
<text x="558" y="377" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#171717">appear in step 2.</text>
<text x="30" y="570" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#232323">Labels and patterns carry meaning in grayscale; production colors remain full-color.</text>
<text x="30" y="530" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#232323">Historical setup is not new cash; the separate receipt calculator stays out of scope.</text>
