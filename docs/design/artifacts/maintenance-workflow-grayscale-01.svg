<text x="551" y="198" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#232323">Recorded, not tenant liability</text>
<line x1="254" y1="183" x2="284" y2="183" stroke="#9b9b9b"/>
<text x="266" y="176" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#232323">&gt;</text>
<line x1="503" y1="183" x2="533" y2="183" stroke="#9b9b9b"/>
<text x="515" y="176" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#232323">&gt;</text>
<text x="40" y="280" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#232323">Conversations remain tenancy-specific. Internal notes remain staff-only.</text>
<line x1="645" y1="230" x2="645" y2="336" stroke="#9b9b9b" stroke-dasharray="3 3"/>
<text x="435" y="311" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#232323">Separate, explicit manager decision</text>
