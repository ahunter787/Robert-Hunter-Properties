<text x="430" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#232323">Prepare recharge &gt; Review &gt; Confirm</text>
<text x="430" y="390" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#232323">Eligible tenancy / manual amount / due date</text>
<text x="430" y="414" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#232323">Post through the existing ledger service</text>
<text x="40" y="483" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#232323">No automatic liability. No inferred allocation. No vendor payment or general ledger.</text>
<text x="30" y="595" font-family="Arial, sans-serif" font-size="9" font-weight="normal" fill="#232323">RHP Design | Proposal | Synthetic data | 1</text>
