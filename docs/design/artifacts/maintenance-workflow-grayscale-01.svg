<text x="302" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#232323">Work tracking</text>
<text x="302" y="198" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#232323">Assignment + status</text>
